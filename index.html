<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Creative Notes 🚀</title>
    <style>
        /* STILE GENERALE (DARK MODE DI BASE) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 210, 0.3);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        /* AREA DI CREAZIONE NOTA */
        .note-creator {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: #00ffcc;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .color-picker {
            display: flex;
            gap: 8px;
        }

        .color-option {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.selected {
            border-color: white;
        }

        button {
            background: #00ffcc;
            color: #121212;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #00ccaa;
        }

        /* GRIGLIA DEI POST-IT */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* STILE DEL SINGOLO POST-IT */
        .note {
            padding: 20px;
            border-radius: 12px;
            color: #121212;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: rotate(calc(var(--rotation, 0deg)));
            transition: 0.3s;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .note:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .note-text {
            font-size: 1.1rem;
            font-weight: 500;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #121212;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
        }

        .delete-btn:hover {
            color: red;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <h1>🚀 Our Secret Board</h1>
    <p class="subtitle">Solo per noi e i nostri amici inglesi</p>

    <!-- CREATORE DI NOTE -->
    <div class="note-creator">
        <textarea id="noteText" placeholder="Scrivi qualcosa di divertente o un promemoria..."></textarea>
        <div class="controls">
            <div class="color-picker" id="colorPicker">
                <div class="color-option selected" style="background: #ff7675;" data-color="#ff7675"></div>
                <div class="color-option" style="background: #74b9ff;" data-color="#74b9ff"></div>
                <div class="color-option" style="background: #55efc4;" data-color="#55efc4"></div>
                <div class="color-option" style="background: #ffeaa7;" data-color="#ffeaa7"></div>
                <div class="color-option" style="background: #a29bfe;" data-color="#a29bfe"></div>
            </div>
            <button onclick="addNote()">Aggiungi 📌</button>
        </div>
    </div>

    <!-- GRIGLIA DOVE APPARIRANNO LE NOTE -->
    <div class="notes-grid" id="notesGrid"></div>

    <script>
        let selectedColor = '#ff7675';
        let notes = JSON.parse(localStorage.getItem('myGroupNotes')) || [];

        // Gestione cambio colore nel creatore
        document.getElementById('colorPicker').addEventListener('click', (e) => {
            if(e.target.classList.contains('color-option')) {
                document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedColor = e.target.dataset.color;
            }
        });

        // Funzione per aggiungere una nota
        function addNote() {
            const text = document.getElementById('noteText').value.trim();
            if(!text) return alert("Scrivi qualcosa prima!");

            const newNote = {
                id: Date.now(),
                text: text,
                color: selectedColor,
                date: new Date().toLocaleDateString('it-IT'),
                // Crea una rotazione casuale per l'effetto post-it storto
                rotation: (Math.random() * 6 - 3).toFixed(1) + 'deg'
            };

            notes.push(newNote);
            saveAndRender();
            document.getElementById('noteText').value = '';
        }

        // Elimina nota
        function deleteNote(id) {
            notes = notes.filter(note => note.id !== id);
            saveAndRender();
        }

        // Salva in memoria locale e mostra a schermo
        function saveAndRender() {
            localStorage.setItem('myGroupNotes', JSON.stringify(notes));
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';

            notes.forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = 'note';
                noteEl.style.backgroundColor = note.color;
                noteEl.style.setProperty('--rotation', note.rotation);

                noteEl.innerHTML = `
                    <div class="note-text">${note.text}</div>
                    <div class="note-footer">
                        <span>${note.date}</span>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">🗑️</button>
                    </div>
                `;
                grid.appendChild(noteEl);
            });
        }

        // Mostra le note al caricamento della pagina
        saveAndRender();
    </script>
</body>
</html>
