<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0455a">
<title>Poli-Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f0455a'/%3E%3Crect x='22' y='26' width='56' height='48' fill='%23fff'/%3E%3Cpath d='M32 42h36M32 54h36M32 66h22' stroke='%23f0455a' stroke-width='5'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Fira+Code&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--accent:#f0455a;--text:#2b2b2b;--line:rgba(0,0,0,.07);--bg:#fdfdfd;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{position:relative;font-family:'Fira Code',monospace;color:var(--text);background:var(--bg);background-attachment:fixed;min-height:100vh;padding:24px 16px 80px;transition:color .4s}
.lines::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(to bottom,transparent 0 15px,var(--line) 15px 16px)}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;text-align:center}
h1,.gate h1{display:inline-block;margin:28px 0 10px;padding:8px 22px;font:800 28px 'Rubik',sans-serif;letter-spacing:1px;color:var(--accent);background:#fff;border:3px solid var(--accent);box-shadow:4px 4px 0 rgba(0,0,0,.12);transition:color .4s,border-color .4s}
.sub{display:inline-block;font-size:11px;font-style:italic;margin:0 0 24px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.35)}
button{font-family:inherit}
/* composer */
.composer{width:min(92vw,380px);margin:0 auto 24px;padding:10px;background:#fff;color:#222;border:1px solid #e3e3e3;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.1);text-align:left}
.composer textarea{width:100%;height:60px;resize:none;padding:6px 8px;font:11px 'Fira Code',monospace;background:#fafafa;border:1px solid #ddd;border-radius:6px}
.composer textarea:focus,.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .2s var(--ease)}
.dot:hover{transform:scale(1.25)}.dot.sel{border-color:#111}
.chip{border:1px solid #ccc;background:#fff;border-radius:6px;padding:3px 8px;font-size:10px;cursor:pointer;transition:all .2s}
.chip.on{background:#222;color:#fff}
input[type=datetime-local]{font:10px 'Fira Code',monospace;border:1px solid #ccc;border-radius:6px;padding:2px 4px}
.btn{border:0;border-radius:6px;padding:6px 12px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.94)}
#add{margin-left:auto}
/* board */
#wrap{min-height:520px}
#board,#stickers,#cursors{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#board{z-index:5}#stickers{z-index:6}#cursors{z-index:30}
.note{pointer-events:auto;position:absolute;width:200px;min-height:120px;padding:8px 12px 12px;text-align:left;border-radius:4px;font-size:12px;box-shadow:2px 4px 10px rgba(0,0,0,.18);color:#222;transform:rotate(var(--r,0deg));transition:box-shadow .2s,transform .2s;z-index:1}
.note.pinned{z-index:3}.note.drag{z-index:9;box-shadow:6px 12px 24px rgba(0,0,0,.3);transform:rotate(0) scale(1.04);transition:none}
.note.new{animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
.note.due{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent),2px 4px 10px rgba(0,0,0,.18)}}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.grip{cursor:grab;touch-action:none;flex:1;opacity:.45;user-select:none;font-size:14px}
.bar button{border:0;background:none;cursor:pointer;font-size:13px;opacity:.55;padding:0;transition:opacity .2s,transform .2s}
.bar button:hover{opacity:1;transform:scale(1.2)}
.pinned .pin{opacity:1}
.txt{white-space:pre-wrap;word-break:break-word;min-height:50px;outline:none}
.item{display:flex;gap:6px;align-items:flex-start;margin:3px 0}.item.d span{text-decoration:line-through;opacity:.5}
.due-b{font-size:10px;margin-top:6px;opacity:.75}
.reacts{display:flex;gap:4px;margin-top:8px}
.reacts button{border:0;border-radius:10px;background:rgba(255,255,255,.55);font-size:11px;padding:1px 6px;cursor:pointer;transition:transform .15s}
.reacts button:hover{transform:scale(1.15)}
.c-red{background:#ff8a8a}.c-blue{background:#8cc8f5}.c-green{background:#8cf0c8}
.dot.c-red{background:#f26b6b}.dot.c-blue{background:#6ab4ee}.dot.c-green{background:#5ef0c0}
.empty{opacity:.7;font-size:12px;padding-top:30px}
/* gear + settings */
#gear{position:fixed;top:14px;right:14px;z-index:20;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0;transition:transform .6s var(--ease)}
#gear:hover{transform:rotate(90deg)}body.open #gear{transform:rotate(180deg)}
#overlay,#drawOv,#pOv{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,0);backdrop-filter:blur(0);visibility:hidden;transition:all .35s var(--ease)}
#overlay.open,#drawOv.open,#pOv.open{visibility:visible;background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.panel{width:min(100%,480px);max-height:85vh;overflow:auto;padding:20px;background:#fff;color:#222;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);opacity:0;transform:translateY(24px) scale(.94);transition:all .4s var(--ease)}
#overlay.open .panel,#drawOv.open .panel,#pOv.open .panel{opacity:1;transform:none}
.panel header{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font:800 18px 'Rubik',sans-serif}.panel h3{margin:16px 0 8px;font-size:13px}
#close{border:0;background:none;font-size:20px;cursor:pointer;transition:transform .3s}#close:hover{transform:rotate(90deg)}
.sws{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:20px}
.sw{width:64px;height:64px;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0;position:relative;box-shadow:0 0 0 1px #ccc inset;opacity:0;transform:scale(.7);transition:transform .25s var(--ease),border-color .2s}
#overlay.open .sw{opacity:1;transform:none;transition:opacity .4s calc(var(--i)*40ms+150ms),transform .4s var(--ease) calc(var(--i)*40ms+150ms)}
#overlay.open .sw:hover{transform:scale(1.1);transition-delay:0s}
.sw.sel{border-color:#111}.sw span{position:absolute;left:-4px;right:-4px;bottom:-18px;text-align:center;font-size:9px;color:#444}
.custom{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px}
.custom input[type=color]{width:36px;height:30px;border:0;padding:0;background:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools .btn{background:#222}
/* social */
#pOv{z-index:60}
.av{cursor:pointer}.av.xs{width:16px;height:16px;font-size:9px;border-width:1px;box-shadow:none}
.av.on,.av.off{position:relative}.av.off{opacity:.5}
.av.on::after{content:"";position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:50%;background:#2ecc71;border:2px solid #fff}
.av.fr{box-shadow:0 0 0 2px #ff6b81}
.strip{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:-8px auto 16px;width:max-content;max-width:92vw;padding:3px 10px;border-radius:16px;background:rgba(255,255,255,.6);color:#222;font-size:11px}
.gate .strip{margin:0}
#chatBtn{position:fixed;top:14px;left:14px;z-index:20;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0;transition:transform .3s var(--ease)}
#chatBtn:hover{transform:scale(1.12)}
#chatBtn i,#chat .tab i{font:700 10px/16px sans-serif;font-style:normal;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e03a3a;color:#fff;text-align:center}
#chatBtn i{position:absolute;top:-7px;right:-7px}#chat .tab i{display:inline-block;margin-left:4px}
#chatBtn i[hidden],#chat .tab i[hidden]{display:none}
#chat{position:fixed;left:0;top:0;bottom:0;width:min(92vw,340px);z-index:40;display:flex;flex-direction:column;background:#fff;color:#222;box-shadow:6px 0 30px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .45s var(--ease)}
#chat.open{transform:none}
#chat header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #eee}
#chat header b{font:800 14px 'Rubik',sans-serif;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chBack,#chClose{border:0;background:none;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:4px}
#chat .tab{border:1px solid #ddd;border-radius:8px;padding:2px 8px;font-size:11px;background:#fff;cursor:pointer}
#chat .tab.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
#chBody{flex:1;overflow:auto;padding:8px 0}
#chBody h4{margin:10px 12px 4px;font-size:11px;opacity:.6}
#chBody .mut{margin:10px 12px}
.msg{display:flex;gap:8px;padding:4px 12px;font-size:12px}.mb{min-width:0}
.mh{display:flex;gap:6px;align-items:baseline}.mt{font-size:9px;opacity:.5}
.mx{word-break:break-word;white-space:pre-wrap}
#chInput{display:flex;gap:6px;padding:8px;border-top:1px solid #eee}
#chInput[hidden]{display:none}
#chInput input{flex:1;min-width:0;font:12px 'Fira Code',monospace;border:1px solid #ccc;border-radius:8px;padding:6px 8px}
.fr-row{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px}.fr-row .btn{padding:3px 8px;font-size:10px}
.pcard{padding:0!important;overflow:hidden;position:relative;width:min(100%,340px)}
#pBanner{height:96px;background:#f0455a}
.pbody{padding:0 18px 18px}
.pfp{display:grid;place-items:center;width:76px;height:76px;margin-top:-38px;border-radius:50%;border:4px solid #fff;color:#fff;font:800 28px 'Rubik',sans-serif;background:#888;position:relative}
#pName{margin:8px 0 2px;font:800 18px 'Rubik',sans-serif}
#pBio{margin:0 0 10px;font-size:12px;opacity:.8;white-space:pre-wrap;word-break:break-word}
#pClose{position:absolute;top:8px;right:10px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.4);color:#fff;cursor:pointer}
#pEdit input[type=text],#pEdit input:not([type]),#pEdit textarea{width:100%;margin:6px 0;padding:6px;font:12px 'Fira Code',monospace;border:1px solid #ccc;border-radius:8px}
#pEdit textarea{height:60px;resize:none}
/* extras */
#tools{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(92vw,720px);margin:0 auto 14px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.6);color:#222}
#tools select,#tools input[type=search]{font:11px 'Fira Code',monospace;border:1px solid #ccc;border-radius:8px;padding:4px 8px;background:#fff;color:#222;min-width:0}
#tools input[type=search]{flex:1;min-width:120px}
.chip.sel{background:#222;color:#fff}
#exp{font:10px 'Fira Code',monospace;border:1px solid #ccc;border-radius:6px;padding:2px 4px;max-width:140px}
#stTray{margin-top:8px;padding-top:8px;border-top:1px dashed #ddd}
.emo{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px}
.emo button{border:0;background:none;font-size:20px;cursor:pointer;padding:2px;border-radius:6px;transition:transform .15s}.emo button:hover{transform:scale(1.3)}
.au{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font:800 9px 'Rubik',sans-serif;color:#fff;flex:none}
.note.dim{opacity:.18;pointer-events:none;filter:grayscale(.6)}
.typing{font-style:italic;opacity:.8}
body.dk .sub{background:rgba(0,0,0,.35)}
.pref{display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0}
#trashList .tr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee;font-size:11px}
#trashList img{height:32px}.tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#trashList .btn{background:#222;padding:3px 8px;font-size:10px}.mut{opacity:.6;font-size:11px;margin:4px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,80px);opacity:0;z-index:60;display:flex;gap:12px;align-items:center;padding:8px 14px;background:#222;color:#fff;border-radius:10px;font-size:12px;transition:all .35s var(--ease);pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{border:0;background:none;color:#ffd166;font:inherit;cursor:pointer;text-decoration:underline}
.cur{position:absolute;left:0;top:0;transition:transform .09s linear}
.cur span{position:absolute;left:14px;top:12px;font-size:10px;color:#fff;padding:1px 6px;border-radius:8px;white-space:nowrap}
#dv{width:100%;max-width:320px;aspect-ratio:1;border:2px dashed #ccc;border-radius:10px;touch-action:none;cursor:crosshair;background:#fff;display:block;margin:10px auto 0}
.drow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
/* stickers */
.sk{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));transition:filter .2s,transform .2s}
.sk.new{animation:pop .45s var(--ease)}
.sk.drag{cursor:grabbing;transform:scale(1.05);filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));transition:none}
.sk img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sk .x,.sk .rz{position:absolute;opacity:0;transition:opacity .2s}
.sk .x{top:-8px;right:-8px;width:20px;height:20px;padding:0;border-radius:50%;border:0;background:#222;color:#fff;font-size:11px;line-height:1;cursor:pointer}
.sk .rz{right:-6px;bottom:-6px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize}
.sk:hover .x,.sk:hover .rz,.sk.drag .x{opacity:1}
@media(hover:none){.sk .x,.sk .rz{opacity:1}}
/* online */
#online{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:-10px auto 18px;width:max-content;max-width:92vw;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.6);color:#222;font-size:11px}
.live{width:8px;height:8px;border-radius:50%;background:#2ecc71;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}100%{box-shadow:0 0 0 8px rgba(46,204,113,0)}}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 11px 'Rubik',sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);animation:pop .4s var(--ease)}
.av.me{outline:2px solid #222;outline-offset:1px}
/* gate */
#syncBox textarea{width:100%;height:90px;margin-top:8px;padding:6px;font:10px monospace;border:1px solid #ccc;border-radius:6px}
.gate a{color:var(--accent);cursor:pointer;text-decoration:underline}
.gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:var(--bg);transition:opacity .6s var(--ease),transform .6s var(--ease),visibility .6s}
.gate.out{opacity:0;transform:scale(1.15);visibility:hidden;pointer-events:none}
.gate .box{background:#fff;color:#222;padding:18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:min(90vw,300px);animation:pop .6s var(--ease)}
.gate input{width:100%;padding:9px;font:13px 'Fira Code',monospace;text-align:center;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;letter-spacing:2px}
.gate small{display:block;margin-top:10px;font-size:10px;opacity:.6}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body class="lines">

<div class="gate" id="gate">
  <h1>POLI-NOTES</h1>
  <div class="box">
    <input id="name" type="text" maxlength="16" placeholder="Your name (optional)" autocomplete="off">
    <input id="code" type="password" placeholder="Access code" autocomplete="off">
    <button class="btn" id="enter" style="width:100%">Enter</button>
    <small>Anyone with the same code sees the same notes.</small>
    <small id="syncRow"></small>
    <div id="syncBox" hidden><textarea id="syncTxt" placeholder="Paste your firebaseConfig here (empty = remove)"></textarea><button class="btn" id="syncSave" style="width:100%">Save &amp; reload</button></div>
  </div>
  <div id="gFriends" class="strip" hidden></div>
</div>

<button id="gear" aria-label="Settings">⚙️</button>

<main>
  <h1>POLI-NOTES</h1><br>
  <p class="sub">Our private corner for thoughts and reminders</p>
  <div id="online" aria-live="polite"></div>
  <div id="fBar" class="strip" hidden></div>
  <section class="composer">
    <textarea id="text" placeholder="Write something fun or a reminder here..."></textarea>
    <div class="row">
      <button class="dot c-red sel" data-c="c-red" aria-label="Red"></button>
      <button class="dot c-blue" data-c="c-blue" aria-label="Blue"></button>
      <button class="dot c-green" data-c="c-green" aria-label="Green"></button>
      <button class="chip" id="listBtn">☑ List</button>
      <button class="chip" id="stBtn">🖼 Stickers</button><input type="file" id="stFile" accept="image/*" multiple hidden>
    </div>
    <div id="stTray" hidden>
      <div class="emo" id="emo"></div>
      <div class="row" style="margin-top:0"><button class="chip" id="upBtn">📁 Upload</button><button class="chip" id="drawBtn">✏️ Draw</button></div>
    </div>
    <div class="row">
      <input type="datetime-local" id="due" title="Reminder">
      <select id="exp" title="Auto-delete"><option value="0">Never expires</option><option value="3600000">Expires in 1 hour</option><option value="86400000">Expires in 1 day</option><option value="604800000">Expires in 1 week</option></select>
      <button class="btn" id="add">Add</button>
    </div>
  </section>
  <div id="tools">
    <select id="boardSel" aria-label="Board"></select><button class="chip" id="newBoard" title="New board">＋</button>
    <input id="q" type="search" placeholder="Search notes...">
    <button class="chip sel" data-f="all">All</button>
    <button class="dot c-red" data-f="c-red" aria-label="Red"></button><button class="dot c-blue" data-f="c-blue" aria-label="Blue"></button><button class="dot c-green" data-f="c-green" aria-label="Green"></button>
  </div>
  <div id="wrap"></div>
</main>

<section id="board"></section><div id="stickers"></div><div id="cursors"></div>
<button id="chatBtn" aria-label="Chat">💬<i id="chatBadge" hidden></i></button>
<aside id="chat" aria-label="Chat">
  <header><button id="chBack" hidden aria-label="Back">←</button><b id="chTitle">Chat</b>
    <span class="tabs"><button class="tab sel" data-t="lobby">Lobby</button><button class="tab" data-t="friends">Friends<i id="reqBadge" hidden></i></button></span>
    <button id="chClose" aria-label="Close">✕</button></header>
  <div id="chBody"></div>
  <div id="chInput"><input id="chText" maxlength="300" placeholder="Say something..." autocomplete="off"><button class="btn" id="chSend">Send</button></div>
</aside>
<div id="pOv"><div class="panel pcard" role="dialog" aria-label="Profile">
  <div id="pBanner"></div>
  <button id="pClose" aria-label="Close">✕</button>
  <div class="pbody"><span id="pPfp" class="pfp"></span><h2 id="pName"></h2><p id="pBio"></p>
    <div id="pActs" class="drow"></div>
    <div id="pEdit" hidden>
      <input id="eName" maxlength="16" placeholder="Name"><textarea id="eBio" maxlength="120" placeholder="Bio (max 120 characters)"></textarea>
      <div class="drow"><button class="btn" id="ePfp" style="background:#222">Photo</button><button class="btn" id="eBan" style="background:#222">Banner</button><input type="color" id="eCol" value="#f0455a" title="Banner color"></div>
      <input type="file" id="ePfpF" accept="image/*" hidden><input type="file" id="eBanF" accept="image/*" hidden>
      <div class="drow"><button class="btn" id="eSave">Save</button><button class="btn" id="eCancel" style="background:#888">Cancel</button></div>
    </div>
  </div>
</div></div>
<div id="toast"></div>
<div id="drawOv"><div class="panel" role="dialog" aria-label="Draw a sticker">
  <header><h2>Draw a sticker</h2><button id="dClose" aria-label="Close" style="border:0;background:none;font-size:20px;cursor:pointer">✕</button></header>
  <canvas id="dv" width="320" height="320"></canvas>
  <div class="drow"><input type="color" id="dp" value="#222222"><input type="range" id="ds" min="2" max="24" value="6"><button class="chip" id="dEr">🧽 Eraser</button><button class="btn" id="dClr" style="background:#222">Clear</button><button class="btn" id="dAdd" style="margin-left:auto">Add sticker</button></div>
</div></div>

<script>
/* ===== FIREBASE (sync) =====
   Paste your project config here. If it stays null,
   notes are saved in this browser only. */
const FIREBASE_CODE = null;   // <- optional: paste your config object here instead of null
const cfgOk=c=>!!(c&&c.apiKey&&c.databaseURL&&!/\.\.\.|TUO-PROGETTO|1a2b3/.test(JSON.stringify(c)));
const FIREBASE_CONFIG=(()=>{if(cfgOk(FIREBASE_CODE))return FIREBASE_CODE;
  try{const c=JSON.parse(localStorage.getItem('pn_fbcfg'));return cfgOk(c)?c:null}catch{return null}})();

const THEMES={
 classic:[
  {id:'classic',name:'Classic',bg:'#fdfdfd',accent:'#f0455a',line:'rgba(0,0,0,.07)'},
  {id:'lred',name:'Light red',bg:'#ffe3e3',accent:'#e03a3a',line:'rgba(160,0,0,.10)'},
  {id:'pink',name:'Pink',bg:'#ffe4f0',accent:'#e0508f',line:'rgba(160,0,80,.10)'},
  {id:'green',name:'Green',bg:'#e0f6e6',accent:'#2f9e5a',line:'rgba(0,100,40,.10)'},
  {id:'neutral',name:'Neutral',bg:'#ececea',accent:'#555',line:'rgba(0,0,0,.08)'},
  {id:'dark',name:'Dark',bg:'#17171c',accent:'#ff6b81',line:'rgba(255,255,255,.06)',dark:1}],
 gradient:[
  {id:'g-red',name:'Red metal',bg:'linear-gradient(135deg,#5c0a14,#c0392b 45%,#e8b0a8 55%,#7a1220)',accent:'#ff6b6b',line:'rgba(255,255,255,.08)',dark:1},
  {id:'g-pink',name:'Pink metal',bg:'linear-gradient(135deg,#7a2250,#e66aa6 45%,#f9d3e6 55%,#a03670)',accent:'#ff7ab8',line:'rgba(255,255,255,.10)',dark:1},
  {id:'g-green',name:'Green metal',bg:'linear-gradient(135deg,#0d4a2e,#2ecc71 45%,#c8f2d9 55%,#157a4a)',accent:'#3be08a',line:'rgba(255,255,255,.10)',dark:1},
  {id:'g-blue',name:'Blue metal',bg:'linear-gradient(135deg,#0b2a4a,#3a82c4 45%,#cfe4f7 55%,#1d5a96)',accent:'#6ab4ee',line:'rgba(255,255,255,.10)',dark:1},
  {id:'g-silver',name:'Silver',bg:'linear-gradient(135deg,#6e7378,#d9dde0 45%,#fff 55%,#8b9095)',accent:'#444',line:'rgba(0,0,0,.08)'}],
 tiedye:[
  {id:'t-rainbow',name:'Rainbow',bg:'radial-gradient(circle at 20% 25%,#ff5f6d 0,transparent 40%),radial-gradient(circle at 80% 20%,#ffd36e 0,transparent 40%),radial-gradient(circle at 70% 80%,#5ee7a5 0,transparent 45%),radial-gradient(circle at 25% 80%,#6aa8ff 0,transparent 45%),#f6f0ff',accent:'#8a3ffc',line:'rgba(0,0,0,.06)'},
  {id:'t-sunset',name:'Sunset',bg:'radial-gradient(circle at 30% 20%,#ff8a5c 0,transparent 45%),radial-gradient(circle at 80% 30%,#ff4d8d 0,transparent 45%),radial-gradient(circle at 50% 90%,#ffd166 0,transparent 50%),#ffe9dc',accent:'#d9366b',line:'rgba(0,0,0,.06)'},
  {id:'t-ocean',name:'Ocean',bg:'radial-gradient(circle at 25% 25%,#4cc9f0 0,transparent 45%),radial-gradient(circle at 80% 35%,#4361ee 0,transparent 45%),radial-gradient(circle at 40% 90%,#80ffdb 0,transparent 50%),#e6f4ff',accent:'#3a56d4',line:'rgba(0,0,0,.06)'},
  {id:'t-candy',name:'Candy',bg:'radial-gradient(circle at 20% 30%,#ff9ad5 0,transparent 42%),radial-gradient(circle at 80% 25%,#b8a1ff 0,transparent 42%),radial-gradient(circle at 60% 85%,#9bf6ff 0,transparent 48%),#fff0fa',accent:'#c13fb0',line:'rgba(0,0,0,.06)'}]
};
const ICON=document.querySelector('link[rel=icon]').href;
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

/* ===== THEMES ===== */
function applyTheme(t,tmp){
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--accent',t.accent);r.setProperty('--line',t.line);
  r.setProperty('--text',t.dark?'#fff':'#2b2b2b');
  document.body.style.background=t.bg;document.body.style.backgroundAttachment='fixed';
  document.body.style.backgroundSize=t.bg.startsWith('url')?'cover':'';
  $('#gate').style.background=t.bg;$('#gate').style.backgroundSize=t.bg.startsWith('url')?'cover':'';
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('sel',b.dataset.id===t.id));
  document.body.classList.toggle('dk',!!t.dark);
  if(!tmp)LS.set('pn_theme',t);
}
let n_=0;
Object.entries(THEMES).forEach(([g,list])=>list.forEach(t=>{
  const b=el('button','sw');b.dataset.id=t.id;b.style.background=t.bg;b.style.setProperty('--i',n_++);
  b.append(el('span',null,t.name));b.onclick=()=>applyTheme(t);$('#g-'+g).append(b);
}));
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255};
$('#applyC').onclick=()=>{const a=$('#c1').value,b=$('#c2').value;
  applyTheme({id:'custom',bg:`linear-gradient(135deg,${a},${b})`,accent:lum(a)>.7?'#444':a,line:'rgba(255,255,255,.12)',dark:(lum(a)+lum(b))/2<.5})};
$('#imgBtn').onclick=()=>$('#img').click();
$('#img').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
  im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    applyTheme({id:'photo',bg:`url(${c.toDataURL('image/jpeg',.7)}) center/cover`,accent:'#f0455a',line:'transparent',dark:0})};
  im.src=URL.createObjectURL(f)};
const open_=v=>{$('#overlay').classList.toggle('open',v);document.body.classList.toggle('open',v)};
$('#gear').onclick=()=>open_(!$('#overlay').classList.contains('open'));
$('#close').onclick=()=>open_(false);
$('#overlay').onclick=e=>{if(e.target.id==='overlay')open_(false)};
addEventListener('keydown',e=>{if(e.key==='Escape'){open_(false);$('#drawOv').classList.remove('open');pOv.classList.remove('open');openChat(false)}});
const mq=matchMedia('(prefers-color-scheme: dark)'),DARK=THEMES.classic.find(t=>t.id==='dark');
function autoTheme(){applyTheme(LS.get('pn_auto',false)&&mq.matches?DARK:LS.get('pn_theme',THEMES.classic[0]),1)}
mq.addEventListener('change',autoTheme);autoTheme();
$('#auto').checked=LS.get('pn_auto',false);$('#auto').onchange=e=>{LS.set('pn_auto',e.target.checked);autoTheme()};
$('#snd').checked=LS.get('pn_snd',true);$('#snd').onchange=e=>LS.set('pn_snd',e.target.checked);

/* ===== ACCESS + DATA ===== */
let room,notes={},ref=null,color='c-red',listMode=false;
let stRef=null,stickers={},trRef=null,trash={},curRef=null,prRef=null,db=null,loaded=false;
let board='main',boardList={main:{name:'Main'}};
const stSeen=new Set(),seen=new Set(),offs=[];
const myId=Math.random().toString(36).slice(2,9);let myName='Guest';
const hue=id=>[...String(id)].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360;
const bpath=()=>'rooms/'+room+(board==='main'?'':'/boards/'+board);
const lk=p=>p+room+(board==='main'?'':'_'+board);
const ANCH=500,PW=()=>document.documentElement.clientWidth;
const safeImg=s=>typeof s==='string'&&s.length<400000&&/^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+\/=]+$/.test(s);
const uid=LS.get('pn_uid',null)||(()=>{const u=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,16);LS.set('pn_uid',u);return u})();
const myProf=LS.get('pn_prof',null)||{name:LS.get('pn_name','')||'Guest '+Math.floor(10+Math.random()*90),bio:'',pfp:'',bc:'#f0455a'};
myName=myProf.name;const profs={[uid]:myProf};
if(FIREBASE_CONFIG&&typeof firebase!=='undefined'){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database()}catch(e){console.error(e)}}

/* lobby */
let lastPres={};
function showOnline(o){
  lastPres=o||{};const list=Object.entries(lastPres),box=$('#online');box.innerHTML='';
  box.append(el('span','live'),el('span',null,'Lobby: '+list.length+' online'));
  list.forEach(([id,u])=>{u=u||{};const fr=u.uid&&friends[u.uid],a=av(u.uid,u.name||'Guest','');
    if(id===myId)a.classList.add('me');if(fr)a.classList.add('fr');
    a.title=(u.name||'Guest')+(id===myId?' (you)':'')+(fr?' - friend':'');box.append(a)});
  const ty=list.filter(([id,u])=>id!==myId&&u&&u.typing&&Date.now()-u.typing<5000).map(([,u])=>u.name||'Guest');
  if(ty.length)box.append(el('span','typing','✍️ '+ty.join(', ')+(ty.length>1?' are':' is')+' typing...'));
  if(!db)box.append(el('span',null,'(sync off)'));
  loadProfiles(list.map(([,u])=>u&&u.uid));
}
function trackPresence(){
  if(!db){showOnline({[myId]:{name:myName,uid}});return}
  prRef=db.ref('rooms/'+room+'/presence');
  db.ref('.info/connected').on('value',s=>{if(s.val()){const me=prRef.child(myId);me.onDisconnect().remove();me.set({name:myName,uid,t:Date.now()})}});
  prRef.on('value',s=>showOnline(s.val()));
}
let tyT=0,tyClr;
function typing(){if(!prRef)return;const n=Date.now();
  if(n-tyT>1500){tyT=n;prRef.child(myId+'/typing').set(n)}
  clearTimeout(tyClr);tyClr=setTimeout(()=>{prRef.child(myId+'/typing').set(0);tyT=0},3000)}

/* helpers */
let toastT;
function toast(msg,undo){const t=$('#toast');t.innerHTML='';t.append(el('span',null,msg));
  if(undo){const b=el('button',null,'Undo');b.onclick=()=>{undo();t.classList.remove('show')};t.append(b)}
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),5000)}
function ping(){
  try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(880,a.currentTime);o.frequency.exponentialRampToValueAtTime(1320,a.currentTime+.12);
    g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch{}
  try{navigator.vibrate&&navigator.vibrate(80)}catch{}}

/* live cursors */
const curEls={};
function renderCursors(o){
  const box=$('#cursors'),now=Date.now();
  Object.keys(curEls).forEach(id=>{if(!o[id]||id===myId||now-o[id].t>15000){curEls[id].remove();delete curEls[id]}});
  Object.entries(o).forEach(([id,c])=>{if(id===myId||!c||now-c.t>15000)return;let e=curEls[id];
    if(!e){e=el('div','cur');const h=hue(id);
      e.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 1l5 13 2-5 5-2z" fill="hsl('+h+',70%,50%)" stroke="#fff" stroke-width="1.2"/></svg>';
      const l=el('span');l.style.background='hsl('+h+',70%,45%)';e.append(l);box.append(e);curEls[id]=e}
    e.lastChild.textContent=c.name||'Guest';e.style.transform='translate('+(PW()/2+c.x)+'px,'+c.y+'px)'})}
let curT=0;
addEventListener('pointermove',ev=>{const n=Date.now();if(!curRef||n-curT<70)return;curT=n;
  curRef.child(myId).set({x:Math.round(ev.pageX-PW()/2),y:Math.round(ev.pageY),name:myName,t:n,u:uid})});
document.addEventListener('pointerleave',()=>curRef&&curRef.child(myId).remove());

/* boards */
function setBoards(v){
  boardList=Object.assign({main:{name:'Main'}},v||{});if(!boardList[board])boardList[board]={name:board};
  const sel=$('#boardSel');sel.innerHTML='';
  Object.entries(boardList).forEach(([id,b])=>{const o=el('option',null,b.name||id);o.value=id;sel.append(o)});sel.value=board}
function switchBoard(id){board=id;LS.set('pn_board_'+room,board);$('#boardSel').value=board;bind()}
$('#boardSel').onchange=e=>switchBoard(e.target.value);
$('#newBoard').onclick=()=>{
  const name=(prompt('Board name?')||'').trim().slice(0,20);if(!name)return;
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'b'+Date.now().toString(36);
  if(id!=='main'&&!boardList[id]){boardList[id]={name};db?db.ref('rooms/'+room+'/boardlist/'+id).set({name}):LS.set('pn_bl_'+room,boardList)}
  setBoards(boardList);switchBoard(id)};

/* data binding */
function bind(){
  if(curRef)curRef.child(myId).remove();
  offs.forEach(r=>r.off());offs.length=0;loaded=false;seen.clear();stSeen.clear();
  notes={};stickers={};trash={};renderCursors({});
  if(db){
    const B=bpath();
    ref=db.ref(B+'/notes');stRef=db.ref(B+'/stickers');trRef=db.ref(B+'/trash');curRef=db.ref(B+'/cursors');
    curRef.child(myId).onDisconnect().remove();
    ref.on('value',s=>{const v=s.val()||{};
      if(loaded&&LS.get('pn_snd',true)&&Object.values(v).some(n=>n&&!notes[n.id]&&n.uid&&n.uid!==uid))ping();
      notes=v;loaded=true;render()});
    stRef.on('value',s=>{stickers=s.val()||{};renderStickers()});
    trRef.on('value',s=>{trash=s.val()||{};renderTrash()});
    curRef.on('value',s=>renderCursors(s.val()||{}));
    offs.push(ref,stRef,trRef,curRef);
  }else{
    ref=stRef=trRef=curRef=null;
    notes=LS.get(lk('pn_'),{});stickers=LS.get(lk('pn_st_'),{});trash=LS.get(lk('pn_tr_'),{});
    render();renderStickers();renderTrash();
  }
}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
async function enter(code){
  code=code.trim().toLowerCase();
  if(!code){const b=$('.gate .box');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
  const nn=$('#name').value.trim().slice(0,16);if(nn&&nn!==myProf.name){myProf.name=nn;saveProf()}myName=myProf.name;
  room=await sha(code);LS.set('pn_code',code);
  board=LS.get('pn_board_'+room,'main');
  if(db){setBoards({});db.ref('rooms/'+room+'/boardlist').on('value',s=>setBoards(s.val()))}
  else setBoards(LS.get('pn_bl_'+room,{}));
  bind();trackPresence();startChat();
  $('#gate').classList.add('out');
}

/* save / delete / history */
const persist=()=>{if(!db)LS.set(lk('pn_'),notes)};
function toTrash(kind,data){
  const t={id:data.id,kind,data,t:Date.now()};trash[t.id]=t;
  trRef?trRef.child(t.id).set(t):LS.set(lk('pn_tr_'),trash);
  const old=Object.values(trash).sort((a,b)=>a.t-b.t);
  while(old.length>40){const o=old.shift();delete trash[o.id];trRef?trRef.child(o.id).remove():LS.set(lk('pn_tr_'),trash)}
  renderTrash()}
const put=n=>{notes[n.id]=n;ref?ref.child(n.id).set(n):persist();render()};
const del=id=>{const n=notes[id];delete notes[id];ref?ref.child(id).remove():persist();render();
  if(n){toTrash('note',n);toast('Note deleted',()=>restore(id))}};
const putSt=o=>{stickers[o.id]=o;stRef?stRef.child(o.id).set(o):LS.set(lk('pn_st_'),stickers);renderStickers()};
const delSt=id=>{const o=stickers[id];delete stickers[id];stRef?stRef.child(id).remove():LS.set(lk('pn_st_'),stickers);renderStickers();
  if(o){toTrash('sticker',o);toast('Sticker removed',()=>restore(id))}};
function restore(id){const t=trash[id];if(!t)return;delete trash[id];
  trRef?trRef.child(id).remove():LS.set(lk('pn_tr_'),trash);
  t.kind==='note'?put(t.data):putSt(t.data);renderTrash()}
function renderTrash(){
  const box=$('#trashList');box.innerHTML='';
  const l=Object.values(trash).sort((a,b)=>b.t-a.t);
  if(!l.length){box.append(el('p','mut','Nothing deleted yet.'));return}
  l.forEach(t=>{const r=el('div','tr');
    if(t.kind==='sticker'){if(safeImg(t.data.src)){const i=el('img');i.src=t.data.src;r.append(i)}}
    else r.append(el('span','tt',(t.data.text||(t.data.items||[]).map(x=>x.t).join(', ')||'Note').slice(0,40)));
    const b=el('button','btn','Restore');b.onclick=()=>restore(t.id);r.append(b);box.append(r)})}
$('#clrTr').onclick=()=>{Object.keys(trash).forEach(id=>trRef&&trRef.child(id).remove());trash={};LS.set(lk('pn_tr_'),trash);renderTrash()};
/* ===== PROFILE / FRIENDS / CHAT ===== */
let friends={},reqIn={},fOn={},unread=0,enterT=0,tab='lobby',dmWith=null,chL=null,dmRef=null,pView=null,pendPfp=null,pendBan=null;
const watched=new Set(),lobbyMsgs=[],pOv=$('#pOv');
const rulesErr=()=>toast('Database rules need updating (see setup steps)');
const fb=p=>{if(p&&p.catch)p.catch(rulesErr);return p};
function saveProf(){LS.set('pn_prof',myProf);myName=myProf.name;profs[uid]=myProf;
  if(db){fb(db.ref('users/'+uid+'/p').set(myProf));if(prRef)prRef.child(myId+'/name').set(myName)}}
function av(u,name,cls){
  const a=el('span','av '+(cls||''),(name||'?')[0].toUpperCase()),p=profs[u];a.title=name||'';
  if(p&&safeImg(p.pfp)){a.style.background='url('+p.pfp+') center/cover';a.textContent=''}
  else a.style.background='hsl('+hue(u||name||'?')+',60%,48%)';
  if(u)a.onclick=e=>{e.stopPropagation();openProfile(u)};
  return a}
async function loadProfiles(ids){
  if(!db)return;const need=[...new Set(ids)].filter(u=>u&&!profs[u]);if(!need.length)return;
  await Promise.all(need.map(u=>db.ref('users/'+u+'/p').once('value').then(s=>{profs[u]=s.val()||{name:'Guest'}}).catch(()=>{profs[u]={name:'Guest'}})));
  refreshUI()}
function refreshUI(){showOnline(lastPres);render();renderStrips();if(chatOpen())renderChat()}
function renderStrips(){
  ['#gFriends','#fBar'].forEach(sel=>{const box=$(sel);box.innerHTML='';const ids=Object.keys(friends);box.hidden=!ids.length;if(!ids.length)return;
    box.append(el('span',null,'Friends'));
    ids.forEach(f=>{const p=profs[f]||{},a=av(f,p.name||'Friend',fOn[f]?'on':'off');a.title=(p.name||'Friend')+(fOn[f]?' (online)':' (offline)');box.append(a)})})}
function badges(){const n=Object.keys(reqIn).length;$('#reqBadge').hidden=!n;$('#reqBadge').textContent=n;
  const t=unread+n;$('#chatBadge').hidden=!t;$('#chatBadge').textContent=t}
const accept=u=>{fb(db.ref('users/'+uid+'/friends/'+u).set({t:Date.now()}));fb(db.ref('users/'+u+'/friends/'+uid).set({t:Date.now()}));fb(db.ref('users/'+uid+'/requests/'+u).remove())};
function startSocial(){
  renderStrips();badges();
  if(!db)return;
  db.ref('users/'+uid+'/p').once('value').then(s=>{if(!s.exists())fb(db.ref('users/'+uid+'/p').set(myProf))}).catch(rulesErr);
  db.ref('.info/connected').on('value',s=>{if(s.val()){const st=db.ref('users/'+uid+'/status');st.onDisconnect().set(false);st.set(true)}});
  const friendsTab=()=>chatOpen()&&tab==='friends'&&!dmWith&&renderChat();
  db.ref('users/'+uid+'/friends').on('value',s=>{friends=s.val()||{};
    Object.keys(friends).forEach(f=>{if(!watched.has(f)){watched.add(f);db.ref('users/'+f+'/status').on('value',x=>{fOn[f]=!!x.val();renderStrips();friendsTab()})}});

    e.onpointerdown=ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);e.classList.add('drag');
      const sx=ev.pageX-e.offsetLeft,sy=ev.pageY-e.offsetTop;
      e.onpointermove=m=>{e.style.left=Math.max(0,Math.min(PW()-e.offsetWidth,m.pageX-sx))+'px';e.style.top=Math.max(0,m.pageY-sy)+'px'};
      e.onpointerup=()=>{e.onpointermove=e.onpointerup=null;e.classList.remove('drag');
        s.cx=Math.round(e.offsetLeft-PW()/2);s.ty=Math.round(e.offsetTop-ANCH);delete s.x;delete s.y;putSt(s)}};
    e.append(im,x,rz);box.append(e)});
  fitPage();
}

/* ===== BACKUP ===== */
$('#exp').onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.values(notes),null,1)],{type:'application/json'}));a.download='poli-notes-backup.json';a.click()};
$('#impBtn').onclick=()=>$('#imp').click();
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{JSON.parse(r.result).forEach(n=>{if(n&&n.id)put(n)})}catch{alert('Invalid file')}};r.readAsText(f)};

/* ===== INSTALLABLE APP (manifest generated on the fly) ===== */
const mf=document.createElement('link');mf.rel='manifest';
mf.href=URL.createObjectURL(new Blob([JSON.stringify({name:'Poli-Notes',short_name:'Poli-Notes',start_url:location.href,scope:location.href.replace(/[^/]*$/,''),display:'standalone',background_color:'#fdfdfd',theme_color:'#f0455a',icons:[{src:ICON,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]})],{type:'application/manifest+json'}));
document.head.append(mf);
</script>
