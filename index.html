<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poli-Notes 📝</title>
    <style>
        /* CONFIGURAZIONE DI BASE DEI TEMI */
        :root {
            --bg-style: #fcfcfc linear-gradient(#e0e0e0 1px, transparent 1px);
        }

        /* STILE SFONDO DINAMICO CON RIGHE IN TRASPARENZA */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-style);
            background-size: 100% 30px;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        /* BOTTONE SETTINGS IN ALTO A DESTRA */
        .settings-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffffff;
            border: 2px solid #ff4757;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .settings-toggle:hover {
            transform: rotate(45deg) scale(1.05);
        }

        /* MENU LATERALE SETTINGS (SIDEBAR) */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -320px;
            width: 280px;
            height: 100vh;
            background: #ffffff;
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
            padding: 25px;
            box-sizing: border-box;
            transition: right 0.3s ease;
            z-index: 99;
            overflow-y: auto;
            border-left: 4px solid #ff4757;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-panel h3 {
            margin-top: 0;
            color: #ff4757;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .theme-section {
            margin-bottom: 25px;
        }

        .theme-section h4 {
            margin: 10px 0;
            color: #57606f;
            font-size: 0.9rem;
        }

        /* GRIGLIA PULSANTI TEMI */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-btn {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f9f9f9;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            border-color: #ff4757;
            background: #fff5f5;
            transform: translateY(-2px);
        }

        /* TITOLO "POLI-NOTES" CON CORNICE ROSSA */
        .title-container {
            border: 4px solid #ff4757;
            background-color: #ffffff;
            padding: 10px 40px;
            border-radius: 4px;
            box-shadow: 4px 4px 0px rgba(255, 71, 87, 0.2);
            text-align: center;
            margin-bottom: 5px;
            margin-top: 40px;
        }

        h1 {
            color: #ff4757;
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
            font-style: italic;
        }

        /* AREA DI CREAZIONE NOTA */
        .note-creator {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
            z-index: 10;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 10px;
            color: #333;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: #ff4757;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .color-picker {
            display: flex;
            gap: 8px;
        }

        .color-option {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.selected {
            border-color: #333;
        }

        button.add-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button.add-btn:hover {
            transform: scale(1.05);
            background: #ff2a3b;
        }

        /* GRIGLIA DEI POST-IT */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            z-index: 10;
        }

        /* STILE DEL SINGOLO POST-IT */
        .note {
            padding: 20px;
            border-radius: 4px;
            color: #121212;
            position: relative;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.12);
            transform: rotate(calc(var(--rotation, 0deg)));
            transition: 0.3s;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .note:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 0 12px 25px rgba(0,0,0,0.18);
            z-index: 20;
        }

        .note-text {
            font-size: 1.1rem;
            font-weight: 500;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #121212;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
        }

        .delete-btn:hover {
            color: #ff4757;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <!-- BOTTONE E PANNELLO IMPOSTAZIONI -->
    <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>
    
    <div class="settings-panel" id="settingsPanel">
        <h3>Custom Themes</h3>
        
        <!-- SEZIONE CLASSIC -->
        <div class="theme-section">
            <h4>🎨 Classic Style</h4>
            <div class="theme-grid">
                <button class="theme-btn" onclick="setTheme('classic')">Classic</button>
                <button class="theme-btn" onclick="setTheme('light-red')">Light Red</button>
                <button class="theme-btn" onclick="setTheme('pink')">Pink</button>
                <button class="theme-btn" onclick="setTheme('green')">Green</button>
                <button class="theme-btn" onclick="setTheme('neutral')">Neutral</button>
            </div>
        </div>

        <!-- SEZIONE GRADIENT METALLO -->
        <div class="theme-section">
            <h4>✨ Metallic Gradients</h4>
            <div class="theme-grid">
                <button class="theme-btn" onclick="setTheme('metal-red')">Metal Red</button>
                <button class="theme-btn" onclick="setTheme('metal-pink')">Metal Pink</button>
                <button class="theme-btn" onclick="setTheme('metal-blue')">Metal Blue</button>
                <button class="theme-btn" onclick="setTheme('metal-gold')">Metal Gold</button>
            </div>
        </div>

        <!-- SEZIONE TIE-DYE -->
        <div class="theme-section">
            <h4>🌈 Tie-Dye Psych</h4>
            <div class="theme-grid">
                <button class="theme-btn" onclick="setTheme('tie-dye-sunset')">Sunset</button>
                <button class="theme-btn" onclick="setTheme('tie-dye-neon')">Neon</button>
                <button class="theme-btn" onclick="setTheme('tie-dye-candy')">Candy floss</button>
            </div>
        </div>
    </div>

    <!-- TITOLO CON CORNICE ROSSA -->
    <div class="title-container">
        <h1>Poli-Notes</h1>
    </div>
    <p class="subtitle">Our private corner for thoughts and reminders</p>

    <!-- CREATORE DI NOTE -->
    <div class="note-creator">
        <textarea id="noteText" placeholder="Write something fun or a reminder here..."></textarea>
        <div class="controls">
            <div class="color-picker" id="colorPicker">
                <div class="color-option selected" style="background: #ff7675;" data-color="#ff7675"></div>
                <div class="color-option" style="background: #74b9ff;" data-color="#74b9ff"></div>
                <div class="color-option" style="background: #55efc4;" data-color="#55efc4"></div>
