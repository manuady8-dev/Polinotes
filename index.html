<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poli-Notes 📝</title>
    <style>
        /* STILE SFONDO A RIGHE TIPO QUADERNO */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc;
            /* Crea l'effetto delle linee del quaderno */
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 30px;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* TITOLO "POLI-NOTES" CON CORNICE ROSSA */
        .title-container {
            border: 4px solid #ff4757;
            background-color: #ffffff;
            padding: 10px 40px;
            border-radius: 4px;
            box-shadow: 4px 4px 0px rgba(255, 71, 87, 0.2);
            text-align: center;
            margin-bottom: 5px;
            margin-top: 20px;
        }

        h1 {
            color: #ff4757;
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9.5rem;
            font-style: italic;
        }

        /* AREA DI CREAZIONE NOTA */
        .note-creator {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
            z-index: 10;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 10px;
            color: #333;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: #ff4757;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .color-picker {
            display: flex;
            gap: 8px;
        }

        .color-option {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.selected {
            border-color: #333;
        }

        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff2a3b;
        }

        /* GRIGLIA DEI POST-IT */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            z-index: 10;
        }

        /* STILE DEL SINGOLO POST-IT */
        .note {
            padding: 20px;
            border-radius: 4px; /* Più squadrati tipo veri post-it */
            color: #121212;
            position: relative;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.15);
            transform: rotate(calc(var(--rotation, 0deg)));
            transition: 0.3s;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .note:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .note-text {
            font-size: 1.1rem;
            font-weight: 500;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #121212;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
        }

        .delete-btn:hover {
            color: #ff4757;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <!-- NUOVO TITOLO CON CORNICE ROSSA -->
    <div class="title-container">
        <h1>Poli-Notes</h1>
    </div>
    <p class="subtitle">Our private corner for thoughts and reminders</p>

    <!-- CREATORE DI NOTE -->
    <div class="note-creator">
        <textarea id="noteText" placeholder="Write something fun or a reminder here..."></textarea>
        <div class="controls">
            <div class="color-picker" id="colorPicker">
                <div class="color-option selected" style="background: #ff7675;" data-color="#ff7675"></div>
                <div class="color-option" style="background: #74b9ff;" data-color="#74b9ff"></div>
                <div class="color-option" style="background: #55efc4;" data-color="#55efc4"></div>
                <div class="color-option" style="background: #ffeaa7;" data-color="#ffeaa7"></div>
                <div class="color-option" style="background: #a29bfe;" data-color="#a29bfe"></div>
            </div>
            <button onclick="addNote()">Add Note 📌</button>
        </div>
    </div>

    <!-- GRIGLIA DOVE APPARIRANNO LE NOTE -->
    <div class="notes-grid" id="notesGrid"></div>

    <script>
        let selectedColor = '#ff7675';
        let notes = JSON.parse(localStorage.getItem('myGroupNotes')) || [];

        document.getElementById('colorPicker').addEventListener('click', (e) => {
            if(e.target.classList.contains('color-option')) {
                document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedColor = e.target.dataset.color;
            }
        });

        function addNote() {
            const text = document.getElementById('noteText').value.trim();
            if(!text) return alert("Please write something first!");

            const newNote = {
                id: Date.now(),
                text: text,
                color: selectedColor,
                date: new Date().toLocaleDateString('en-GB'), // Data in formato UK (gg/mm/aaaa)
                rotation: (Math.random() * 6 - 3).toFixed(1) + 'deg'
            };

            notes.push(newNote);
            saveAndRender();
            document.getElementById('noteText').value = '';
        }

        function deleteNote(id) {
            notes = notes.filter(note => note.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myGroupNotes', JSON.stringify(notes));
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';

            notes.forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = 'note';
                noteEl.style.backgroundColor = note.color;
                noteEl.style.setProperty('--rotation', note.rotation);

                noteEl.innerHTML = `
                    <div class="note-text">${note.text}</div>
                    <div class="note-footer">
                        <span>${note.date}</span>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">🗑️</button>
                    </div>
                `;
                grid.appendChild(noteEl);
            });
        }

        saveAndRender();
    </script>
</body>
</html>
