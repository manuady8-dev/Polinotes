<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poli-Notes Clone</title>
    <style>
        /* Reset e Font */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Sfondo a righe stile quaderno */
        body {
            min-height: 100vh;
            background-color: #ffffff;
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            position: relative;
        }

        /* Icona Impostazioni (Ingranaggio) in alto a destra */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 32px;
            height: 32px;
            border: 2px solid #e07a7a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e07a7a;
            font-weight: bold;
            font-size: 18px;
            background: #ffffff;
            transition: background 0.2s;
        }
        .settings-btn:hover {
            background: #fff0f0;
        }

        /* Header Principale */
        .header-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-box {
            border: 3px solid #dc3545;
            padding: 8px 30px;
            display: inline-block;
            background-color: #ffffff;
        }

        .logo-text {
            color: #dc3545;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: #777777;
            font-size: 13px;
            margin-top: 10px;
        }

        /* Box della Nota Centrale */
        .note-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            width: 90%;
            max-width: 440px;
            padding: 20px;
            border: 1px solid #f0f0f0;
        }

        /* Area di Testo */
        .note-textarea {
            width: 100%;
            height: 100px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            color: #4a5568;
            resize: none;
            outline: none;
            background-color: #fafafa;
        }
        .note-textarea::placeholder {
            color: #a0aec0;
            font-style: italic;
        }
        .note-textarea:focus {
            border-color: #cbd5e1;
            background-color: #ffffff;
        }

        /* Contenitore dei pallini colorati */
        .color-palette {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-left: 5px;
        }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.15);
            transition: transform 0.1s;
        }
        .color-dot:hover {
            transform: scale(1.15);
        }

        /* Varianti Colore dei Pallini */
        .dot-red { background-color: #f28b82; }
        .dot-blue { background-color: #aecbfa; }
        .dot-green { background-color: #ccff90; }
    </style>
</head>
<body>

    <!-- Icona Ingranaggio (Simulata con entità HTML &sube;) -->
    <div class="settings-btn" title="Impostazioni">&#9881;</div>

    <!-- Header -->
    <div class="header-container">
        <div class="logo-box">
            <h1 class="logo-text">Poli-Notes</h1>
        </div>
        <p class="subtitle">Our private corner for thoughts and reminders</p>
    </div>

    <!-- Blocco Nota -->
    <div class="note-card">
        <textarea class="note-textarea" placeholder="Write something fun or a reminder here..."></textarea>
        
        <!-- Palette Colori -->
        <div class="color-palette">
            <div class="color-dot dot-red" title="Rosso"></div>
            <div class="color-dot dot-blue" title="Blu"></div>
            <div class="color-dot dot-green" title="Verde"></div>
        </div>
    </div>

</body>
</html>
